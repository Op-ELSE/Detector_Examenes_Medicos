<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detector de Campos de Exámenes Médicos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Detector de Campos de Exámenes Médicos</h1>
  <div class="upload-section">
    <input type="file" id="file-input" multiple accept=".pdf" />
    <button id="upload-btn">Subir y Extraer</button>
    <button id="export-btn" disabled>Exportar a Excel</button>
    <div id="status" class="status"></div>
  </div>
  <div id="table-container" class="table-container"></div>

  <script src="app.js"></script>
</body>
</html>
